<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- un pellet: cilindro visto di lato, con la faccia del taglio a sinistra -->
    <g id="pellet">
      <path d="M0,-34 L190,-34 A15,34 0 0 1 190,34 L0,34 Z" fill="#B97B42" stroke="#5B3818" stroke-width="7" stroke-linejoin="round"/>
      <path d="M8,-22 L188,-22" stroke="#D69A5C" stroke-width="8" stroke-linecap="round"/>
      <path d="M8,20 L186,20" stroke="#94602F" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="15" ry="34" fill="#E7B87C" stroke="#5B3818" stroke-width="7"/>
      <ellipse cx="0" cy="0" rx="6.5" ry="16" fill="none" stroke="#B97B42" stroke-width="4"/>
    </g>
  </defs>

  <!-- foglia con picciolo, dietro ai pellet -->
  <g transform="translate(300,236) rotate(-48)">
    <path d="M-18,0 L10,0" stroke="#2E6B30" stroke-width="10" stroke-linecap="round"/>
    <path d="M6,0 C60,-78 168,-86 222,-6 C160,58 64,62 6,0 Z" fill="#5DB85F" stroke="#2E6B30" stroke-width="8" stroke-linejoin="round"/>
    <path d="M14,0 C80,-6 150,-8 206,-6" fill="none" stroke="#2E6B30" stroke-width="6" stroke-linecap="round"/>
    <path d="M78,-3 L112,-38 M120,-5 L150,-38 M96,-3 L124,26 M140,-5 L166,22" stroke="#2E6B30" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- tre pellet: due appoggiati, uno sopra -->
  <use href="#pellet" transform="translate(70,400) rotate(-12)"/>
  <use href="#pellet" transform="translate(196,430) rotate(8)"/>
  <use href="#pellet" transform="translate(112,316) rotate(-24)"/>
</svg>
